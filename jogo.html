<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Batalhe em turnos contra goblins e chefes">
    <meta name="theme-color" content="#1B4332">
    <title> RPG Turnos - Batalha</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <header class="barra-superior" role="banner">
        <br>    
        <img src="imagens/logo urubu.png" alt="Logo do jogo" width="75px" height="75px" class="logo" onclick="irinicio()" tabindex="0" onkeypress="irinicio()">
    </header>
    
    <main>
        <!-- Tela de Escolha de Personagem -->
        <div id="telaescolha" role="region" aria-label="Escolha do personagem">
            <div class="personagens" onclick="escolher('guerreiro')" tabindex="0" onkeypress="escolher('guerreiro')" role="button" aria-label="Escolher Guerreiro">
                <br>
                <h1>Guerreiro</h1>
                <img src="imagens/guerreiro.png" alt="Guerreiro - Personagem com alta vida e força baixa" width="125" height="175">
                <br>
                <div class="linha" aria-hidden="true"></div>
                <div class="status">
                    <img src="imagens/forca.png" alt="" width="60px" height="60px" aria-hidden="true">
                    <p class="stat">Força:</p>
                    <p class="statu2">Baixa</p>
                </div>
                <div class="status">
                    <img src="imagens/vida.png" alt="" width="60px" height="60px" aria-hidden="true">
                    <p class="stat">Vida:</p>
                    <p class="statu1">Alta</p>
                </div>
                <br>
                <div class="linha" aria-hidden="true"></div>
                <br>
                <p id="escolherguerreiro">Escolher</p>
            </div>
            
            <div class="personagens" onclick="escolher('mago')" tabindex="0" onkeypress="escolher('mago')" role="button" aria-label="Escolher Mago">
                <br>
                <h1>Mago</h1>
                <img src="imagens/mago.png" alt="Mago - Personagem com alta força e vida baixa" width="150" height="200">
                <div class="linha" aria-hidden="true"></div>
                <div class="status">
                    <img src="imagens/forca.png" alt="" width="60px" height="60px" aria-hidden="true">
                    <p class="stat">Força:</p>
                    <p class="statu1">Alta</p>
                </div>
                <div class="status">
                    <img src="imagens/vida.png" alt="" width="60px" height="60px" aria-hidden="true">
                    <p class="stat">Vida:</p>
                    <p class="statu2">Baixa</p>
                </div>
                <br>
                <div class="linha" aria-hidden="true"></div>
                <br>
                <p id="escolhermago">Escolher</p>
            </div>
        </div>
        
        <!-- Tela de Combate -->
        <div id="telacombate" role="region" aria-label="Área de batalha">
            <div class="info">
                <p id="informacao" aria-live="polite"></p>
            </div>
            
            <div class="turnoacao">
                <p id="turnoacao" aria-live="assertive"></p>
            </div>
            
            <!-- Efeitos do Jogador -->
            <div class="efeitoduracaoeu">
                <p id="duracaoescudo" class="duracao" aria-label="Duração do escudo"></p>
                <p id="duracaoaparo" class="duracao" aria-label="Duração do aparo"></p>
                <p id="duracaododge" class="duracao" aria-label="Duração da esquiva"></p>
            </div>
            <div class="efeitoseu">
                <div class="efeitos" id="escudomagico" aria-label="Escudo Mágico ativo">
                    <img src="imagens/escudomagico.png" alt="Escudo Mágico" width="50px" height="50px">
                </div>
                <div class="efeitos" id="aparo" aria-label="Aparo ativo">
                    <img src="imagens/aparo.png" alt="Aparo" width="50px" height="50px">
                </div>
                <div class="efeitos" id="dodge" aria-label="Esquiva ativa">
                    <img src="imagens/dodge.png" alt="Esquiva" width="50px" height="50px">
                </div>
            </div>
            
            <!-- Efeitos do Inimigo -->
            <div class="efeitoduracaoinimigo">
                <p id="duracaoatordoadoinimigo" class="duracao" aria-label="Duração do atordoamento"></p>
                <p id="duracaosangue" class="duracao" aria-label="Duração do sangramento"></p>
                <p id="duracaofogo" class="duracao" aria-label="Duração da queimadura"></p>
            </div>
            <div class="efeitosinimigo">
                <div class="efeitos" id="atordoadoinimigo" aria-label="Atordoado">
                    <img src="imagens/atordoado.png" alt="Atordoado" width="50px" height="50px">
                </div>
                <div class="efeitos" id="sangue" aria-label="Sangramento">
                    <img src="imagens/sangue.png" alt="Sangramento" width="50px" height="50px">
                </div>
                <div class="efeitos" id="fogo" aria-label="Queimadura">
                    <img src="imagens/fogo.png" alt="Queimadura" width="50px" height="50px">
                </div>
            </div>
            
            <!-- Barras de Vida -->
            <div class="vida" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100" aria-label="Vida do jogador">
                <div id="barravidajogador">
                    <p id="vidanumerojogador"></p>
                </div>
            </div>
            <img id="imgjogador" alt="Seu personagem">
            
            <div class="vidainimigo" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100" aria-label="Vida do inimigo">
                <div id="barravidainimigo">
                    <p id="vidanumeroinimigo"></p>
                </div>
            </div>
            <img id="imginimigo" src="imagens/goblin.png" alt="Inimigo" width="500px" height="500px">
            
            <!-- Ações -->
            <div class="acoes" role="toolbar" aria-label="Ações disponíveis">
                <div id="atacar" tabindex="0" onkeypress="atacar()">
                    <img src="imagens/ataque.png" alt="" width="75px" height="75px" aria-hidden="true">
                    <p onclick="atacar()">Atacar</p>
                </div>
                <div class="linhadois" aria-hidden="true"></div>
                <div id="curar" tabindex="0" onkeypress="curar()">
                    <img src="imagens/cura.png" alt="" width="75px" height="75px" aria-hidden="true">
                    <p onclick="curar()">Curar</p>
                </div>
                <div class="linhadois" aria-hidden="true"></div>
                <div id="habilidades" tabindex="0" onkeypress="toggleSkills()">
                    <img src="imagens/habilidades.png" alt="" width="75px" height="75px" aria-hidden="true">
                    <p onclick="toggleSkills()">Skills</p>
                </div>
            </div>
            
            <!-- Habilidades -->
            <div id="skill" role="menu" aria-label="Habilidades disponíveis">
                <div>
                    <br>
                    <p id="skill1" onclick="usarskill1()" onmouseover="mostrardescricao('skill1')" onmouseout="limpardescricao()" tabindex="0" onkeypress="usarskill1()" role="menuitem">></p>             
                    <br>
                    <div class="linhatres" aria-hidden="true"></div>
                    <br>
                    <p id="skill2" onclick="usarskill2()" onmouseover="mostrardescricao('skill2')" onmouseout="limpardescricao()" tabindex="0" onkeypress="usarskill2()" role="menuitem">></p>
                    <br>
                    <div class="linhatres" aria-hidden="true"></div>
                    <br>
                    <p id="skill3" onclick="usarskill3()" onmouseover="mostrardescricao('skill3')" onmouseout="limpardescricao()" tabindex="0" onkeypress="usarskill3()" role="menuitem">></p>
                </div>
            </div>
            
            <div id="resultado" role="alert" aria-live="assertive"></div>
        </div>
        
        <!-- Tela de Recompensa -->
        <div id="telarecompensa" role="dialog" aria-label="Escolha sua recompensa">
            <p class="aa">Parabéns! Selecione um para avançar:</p>
            <div class="recompensas" onclick="escolherRecompensa('dano')" tabindex="0" onkeypress="escolherRecompensa('dano')" role="button" aria-label="Aumentar ataque em 4">
                <br><br>
                <img src="imagens/ataque.png" alt="Ícone de ataque" width="100px" height="100px">
                <br>
                Aumentar ataque em 4
            </div>
            <div class="recompensas" onclick="escolherRecompensa('cura')" tabindex="0" onkeypress="escolherRecompensa('cura')" role="button" aria-label="Curar 40 pontos de vida">
                <br><br>
                <img src="imagens/cura.png" alt="Ícone de cura" width="100px" height="100px">
                <br>
                Se curar em 40
            </div>
            <div class="recompensas" onclick="escolherRecompensa('skill')" tabindex="0" onkeypress="escolherRecompensa('skill')" role="button" aria-label="Adquirir habilidade nova">
                <br><br><br>
                <p class="interrogacao">?</p>
                <br><br>
                Adquirir habilidade nova.
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
