<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <header class="barra-superior">
        <img src="imagens/logo urubu.png" alt="Logo" class="logo">
    </header>

    <div id="telaescolha">
        <div class="personagens" onclick="escolher('guerreiro')">
            <h1>Guerreiro</h1>
            <img src="imagens/guerreiro.png" alt="">
            <div class="linha"></div>
            <div class="status">
                <img src="imagens/forca.png" alt="">
                <p class="stat">Força:</p>
                <p class="statu2">Baixa</p>
            </div>
            <div class="status">
                <img src="imagens/vida.png" alt="">
                <p class="stat">Vida:</p>
                <p class="statu1">Alta</p>
            </div>
            <div class="linha"></div>
            <p id="escolherguerreiro">Escolher</p>
        </div>
        <div class="personagens" onclick="escolher('mago')">
            <h1>Mago</h1>
            <img src="imagens/mago.png" alt="">
            <div class="linha"></div>
            <div class="status">
                <img src="imagens/forca.png" alt="">
                <p class="stat">Força:</p>
                <p class="statu1">Alta</p>
            </div>
            <div class="status">
                <img src="imagens/vida.png" alt="">
                <p class="stat">Vida:</p>
                <p class="statu2">Baixa</p>
            </div>
            <div class="linha"></div>
            <p id="escolhermago">Escolher</p>
        </div>
    </div>

    <div id="telacombate">
        <div class="info">
            <p id="informacao"></p>
        </div>

        <div class="turnoacao">
            <p id="turnoacao"></p>
        </div>

        <div class="areabatalha">
            <div class="ladojogador">
                <div class="efeitoduracaoeu">
                    <p id="duracaoescudo" class="duracao"></p>
                    <p id="duracaoaparo" class="duracao"></p>
                    <p id="duracaododge" class="duracao"></p>
                </div>
                <div class="efeitoseu">
                    <div class="efeitos" id="escudomagico">
                        <img src="imagens/escudomagico.png" alt="">
                    </div>
                    <div class="efeitos" id="aparo">
                        <img src="imagens/aparo.png" alt="">
                    </div>
                    <div class="efeitos" id="dodge">
                        <img src="imagens/dodge.png" alt="">
                    </div>
                </div>
                <div class="vida">
                    <div id="barravidajogador">
                        <p id="vidanumerojogador"></p>
                    </div>
                </div>
                <img id="imgjogador" alt="Jogador">
            </div>

            <div class="painelacoes">
                <div class="acoes">
                    <div id="atacar">
                        <img src="imagens/ataque.png" alt="">
                        <p onclick="atacar()">Atacar</p>
                    </div>
                    <div class="linhadois"></div>
                    <div id="curar">
                        <img src="imagens/cura.png" alt="">
                        <p onclick="curar()">Curar</p>
                    </div>
                    <div class="linhadois"></div>
                    <div id="habilidades">
                        <img src="imagens/habilidades.png" alt="">
                        <p onclick="toggleSkills()">Skills</p>
                    </div>
                </div>
                <div id="skill">
                    <p id="skill1" onclick="usarskill1()" onmouseover="mostrardescricao('skill1')" onmouseout="limpardescricao()">></p>
                    <div class="linhatres"></div>
                    <p id="skill2" onclick="usarskill2()" onmouseover="mostrardescricao('skill2')" onmouseout="limpardescricao()">></p>
                    <div class="linhatres"></div>
                    <p id="skill3" onclick="usarskill3()" onmouseover="mostrardescricao('skill3')" onmouseout="limpardescricao()">></p>
                </div>
            </div>

            <div class="ladoinimigo">
                <div class="efeitoduracaoinimigo">
                    <p id="duracaoatordoadoinimigo" class="duracao"></p>
                    <p id="duracaosangue" class="duracao"></p>
                    <p id="duracaofogo" class="duracao"></p>
                </div>
                <div class="efeitosinimigo">
                    <div class="efeitos" id="atordoadoinimigo">
                        <img src="imagens/atordoado.png" alt="">
                    </div>
                    <div class="efeitos" id="sangue">
                        <img src="imagens/sangue.png" alt="">
                    </div>
                    <div class="efeitos" id="fogo">
                        <img src="imagens/fogo.png" alt="">
                    </div>
                </div>
                <div class="vidainimigo">
                    <div id="barravidainimigo">
                        <p id="vidanumeroinimigo"></p>
                    </div>
                </div>
                <img id="imginimigo" src="imagens/goblin.png" alt="Inimigo">
            </div>
        </div>

        <div id="resultado"></div>
    </div>

    <div id="telarecompensa">
        <p class="aa">Parabéns! Selecione um para avançar:</p>
        <div class="recompensas" onclick="escolherRecompensa('dano')">
            <img src="imagens/ataque.png" alt="">
            Aumentar ataque em 4
        </div>
        <div class="recompensas" onclick="escolherRecompensa('cura')">
            <img src="imagens/cura.png" alt="">
            Se curar em 40
        </div>
        <div class="recompensas" onclick="escolherRecompensa('skill')">
            <p class="interrogacao">?</p>
            Adquirir habilidade nova.
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
